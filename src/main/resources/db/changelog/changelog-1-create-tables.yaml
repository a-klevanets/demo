databaseChangeLog:

  - changeSet:
      id: 001-init-schema-and-admin
      author: liquibase
      changes:
        # --- Tables ---
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role

        - createTable:
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: role_permissions
            columnNames: role_id,permission_id
            constraintName: pk_role_permissions

        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role

        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_role_permissions_permission

        # --- Seed data ---
        - sql:
            sql: |
              INSERT INTO permissions (name) VALUES
                ('user_read'),
                ('user_write'),
                ('users:create'),
                ('users:update'),
                ('users:read'),
                ('user:delete');

              INSERT INTO roles (name) VALUES ('admin');

              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM roles r, permissions p
              WHERE r.name = 'admin';

              -- Password is bcrypt hash for 'admin'
              INSERT INTO users (username, password, role_id)
              SELECT 'admin', '$2a$10$XPfXfc7sedeGlyt.kJ9UAefuZmCNu5UNsuK3rAE8Ke7i21PW5XHsK', r.id
              FROM roles r
              WHERE r.name = 'admin';

