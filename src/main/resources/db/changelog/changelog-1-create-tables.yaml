databaseChangeLog:

  - changeSet:
      id: 001-create-roles
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              - tableExists:
                  tableName: roles
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 002-create-permissions
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              - tableExists:
                  tableName: permissions
      changes:
        - createTable:
            tableName: permissions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 003-create-users
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              - tableExists:
                  tableName: users
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role

  - changeSet:
      id: 004-create-role-permissions
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              - tableExists:
                  tableName: role_permissions
      changes:
        - createTable:
            tableName: role_permissions
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: permission_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: role_permissions
            columnNames: role_id,permission_id
            constraintName: pk_role_permissions

        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_role_permissions_role

        - addForeignKeyConstraint:
            baseTableName: role_permissions
            baseColumnNames: permission_id
            referencedTableName: permissions
            referencedColumnNames: id
            constraintName: fk_role_permissions_permission

  - changeSet:
      id: 005-insert-admin-role-and-permissions
      author: liquibase
      changes:
        - sql:
            sql: |
              INSERT IGNORE INTO permissions (name) VALUES ('user_read');
              INSERT IGNORE INTO permissions (name) VALUES ('user_write');
              INSERT IGNORE INTO permissions (name) VALUES ('users:create');
              INSERT IGNORE INTO permissions (name) VALUES ('users:update');
              INSERT IGNORE INTO permissions (name) VALUES ('users:read');
              INSERT IGNORE INTO permissions (name) VALUES ('user:delete');

              INSERT IGNORE INTO roles (name) VALUES ('admin');

  - changeSet:
      id: 006-map-admin-role-permissions
      author: liquibase
      changes:
        - sql:
            sql: |
              INSERT IGNORE INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id
              FROM roles r, permissions p
              WHERE r.name = 'admin' AND p.name IN ('user_read','user_write','users:create','users:update','users:read','user:delete');

  - changeSet:
      id: 007b-insert-admin-user-and-fix-roleid
      author: liquibase
      changes:
        - sql:
            sql: |
              -- Insert a default admin user if it does not exist. Password is a bcrypt hash for 'admin'.
              INSERT INTO users (username, password, role_id)
              SELECT 'admin', '$2a$10$Dow1ZPpe3ZsVQn6y1YVbQO.Lw6h5jR0V2b9w7ZCk4Xqg2JQqZp1Q8K', r.id
              FROM roles r
              WHERE r.name = 'admin'
                AND NOT EXISTS (SELECT 1 FROM users u WHERE u.username = 'admin');

              -- Fix existing users that have role_id = 0 (invalid) or NULL to point to admin role
              UPDATE users u
              JOIN roles r ON r.name = 'admin'
              SET u.role_id = r.id
              WHERE u.role_id IS NULL OR u.role_id = 0;

  - changeSet:
      id: 007-add-roleid-to-users
      author: liquibase
      preConditions:
        onFail: MARK_RAN
        onError: HALT
        preConditions:
          - not:
              - columnExists:
                  tableName: users
                  columnName: role_id
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: true

        - sql:
            sql: |
              -- set existing users to admin role if present
              UPDATE users u
              JOIN roles r ON r.name = 'admin'
              SET u.role_id = r.id
              WHERE u.role_id IS NULL;

        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_users_role






